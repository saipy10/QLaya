# Run from the repository root:
# docker compose -f compose.yaml -f compose.example.yml run --build --rm qlaya
# For NVIDIA, append -f compose.cuda.yaml before "run".
# This override inherits the image build and persistent cache from compose.yaml.
services:
  qlaya:
    environment:
      QLAYA_DEVICE: "${QLAYA_DEVICE:-cpu}"
      QLAYA_MODEL: "${QLAYA_MODEL:-english}"
      QLAYA_REQUEST_FILE: /inputs/request.json
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-4}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"

      # Local checkpoint: set QLAYA_MODEL=auto above, then enable both this
      # setting and the checkpoint mount below. The directory must be writable
      # by UID 10001 for tokenizer compatibility updates.
      # QLAYA_MODEL_PATH: /models/custom

      # Optional token: enable this setting and its read-only mount below.
      # The token file must be readable by UID 10001. Never put its value here.
      # HF_TOKEN_FILE: /run/secrets/hf_token
    volumes:
      # Replace the source path with your own request file.
      - ./examples/docker/request.json:/inputs/request.json:ro
      # - ${QLAYA_CHECKPOINT_PATH:?Set QLAYA_CHECKPOINT_PATH}:/models/custom
      # - ${HF_TOKEN_PATH:?Set HF_TOKEN_PATH}:/run/secrets/hf_token:ro
