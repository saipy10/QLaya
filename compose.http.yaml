# Serve QLaya over HTTP from the same image, so a Jev client can point its `baseUrl` at it:
#
#   docker compose -f compose.yaml -f compose.http.yaml up --build qlaya-serve
#   curl -s localhost:8000/health
#   curl -s localhost:8000/v1/systemone -H 'content-type: application/json' \
#     --data @examples/docker/request.json
#
# For NVIDIA, append -f compose.cuda.yaml before "up":
#
#   docker compose -f compose.yaml -f compose.http.yaml -f compose.cuda.yaml up --build qlaya-serve
#
# This file is additive. `qlaya` in compose.yaml still runs the one-shot SDK quickstart and
# still publishes no ports, so `docker compose run --rm qlaya` behaves exactly as before.
# Weights share the same named cache volume as that service.
#
# Set QLAYA_API_KEY (or QLAYA_API_KEY_FILE) to require `Authorization: Bearer <key>`.
# QLAYA_PRELOAD=1 builds every checkpoint at startup so the first request does not pay for
# it; the default here is 0 because it makes the container download the whole family on
# first boot, which is a surprise in a quickstart.
services:
  qlaya-serve:
    build:
      context: .
      args:
        TORCH_INDEX: "${QLAYA_TORCH_INDEX:-cpu}"
        TORCH_VERSION: "${QLAYA_TORCH_VERSION:-2.14.0}"
    # Overrides the image's one-shot quickstart CMD; the ENTRYPOINT that loads *_FILE
    # secrets still runs first.
    command: ["qlaya-serve"]
    ports:
      # Host address, host port, container port. The port comes from QLAYA_PORT, which
      # `qlaya-serve` itself reads, so the two sides cannot drift apart. The host side
      # stays on loopback unless QLAYA_BIND_ADDRESS says otherwise, because the API has
      # no authentication until QLAYA_API_KEY is set.
      - "${QLAYA_BIND_ADDRESS:-127.0.0.1}:${QLAYA_PORT:-8000}:${QLAYA_PORT:-8000}"
    environment:
      QLAYA_HOST: "${QLAYA_HOST:-0.0.0.0}"
      QLAYA_PORT: "${QLAYA_PORT:-8000}"
      QLAYA_DEVICE: "${QLAYA_DEVICE:-cpu}"
      # Autocast dtype the runtime reads when building the model; empty keeps the checkpoint's own
      # `amp_dtype`. Set QLAYA_CUDA_AMP=fp16 to serve fp16 on a GPU host.
      QLAYA_CUDA_AMP: "${QLAYA_CUDA_AMP:-}"
      QLAYA_CPU_AMP: "${QLAYA_CPU_AMP:-}"
      QLAYA_PRELOAD: "${QLAYA_PRELOAD:-0}"
      QLAYA_MODELS: "${QLAYA_MODELS:-}"
      QLAYA_THREADS: "${QLAYA_THREADS:-${OMP_NUM_THREADS:-4}}"
      QLAYA_AUTO_TASK: "${QLAYA_AUTO_TASK:-0}"
      # Empty keeps Router's own default (2). Set 3 when QLAYA_AUTO_TASK is on: that adds a
      # third checkpoint routing can choose on demand, and a cap below it reloads one per switch.
      QLAYA_MAX_LOADED: "${QLAYA_MAX_LOADED:-}"
      QLAYA_LOG_LEVEL: "${QLAYA_LOG_LEVEL:-info}"
      QLAYA_API_KEY: "${QLAYA_API_KEY:-}"
      QLAYA_API_KEY_FILE: "${QLAYA_API_KEY_FILE:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_TOKEN_FILE: "${HF_TOKEN_FILE:-}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-4}"
    volumes:
      - model-cache:/home/qlaya/.cache/huggingface
      # Optional token files, readable by UID 10001. Never put a secret value in the
      # environment; these paths are read once at startup and the *_FILE variable is
      # then removed before the server execs.
      # - ${HF_TOKEN_PATH:?Set HF_TOKEN_PATH}:/run/secrets/hf_token:ro
      # - ${QLAYA_API_KEY_PATH:?Set QLAYA_API_KEY_PATH}:/run/secrets/laya_api_key:ro
    init: true
    restart: unless-stopped
    # The server preloads before it binds, so /health answers once the preloaded
    # checkpoints are ready. `up --wait` therefore waits for a usable server.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['QLAYA_PORT'] + '/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m
      start_interval: 2s

volumes:
  model-cache:
    name: "${QLAYA_CACHE_VOLUME:-${COMPOSE_PROJECT_NAME}_model-cache}"
