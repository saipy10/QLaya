# DGX Spark is Linux ARM64 with NVIDIA CUDA 13.0, not Apple MPS or Jetson.
# Use instead of compose.cuda.yaml, with compose.yaml for the SDK quickstart and
# with compose.http.yaml as well for the HTTP server:
#   docker compose -f compose.yaml -f compose.spark.yaml run --build --rm qlaya
#   docker compose -f compose.yaml -f compose.http.yaml -f compose.spark.yaml up --build qlaya-serve
# `qlaya-serve` repeats the settings because it is a separate service; overrides
# for `qlaya` never reach it.
services:
  qlaya:
    platform: linux/arm64
    build:
      args:
        TORCH_INDEX: "${QLAYA_TORCH_INDEX:-cu130}"
    environment:
      QLAYA_DEVICE: "${QLAYA_DEVICE:-cuda}"
      # Autocast dtype the runtime reads; empty keeps the checkpoint's own `amp_dtype`. Both
      # services need it, because an override on `qlaya` never reaches `qlaya-serve`.
      QLAYA_CUDA_AMP: "${QLAYA_CUDA_AMP:-}"
      QLAYA_CPU_AMP: "${QLAYA_CPU_AMP:-}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${QLAYA_GPU_ID:-0}"]
              capabilities: [gpu]

  qlaya-serve:
    platform: linux/arm64
    build:
      context: .
      args:
        TORCH_INDEX: "${QLAYA_TORCH_INDEX:-cu130}"
    environment:
      QLAYA_DEVICE: "${QLAYA_DEVICE:-cuda}"
      # Autocast dtype the runtime reads; empty keeps the checkpoint's own `amp_dtype`. Both
      # services need it, because an override on `qlaya` never reaches `qlaya-serve`.
      QLAYA_CUDA_AMP: "${QLAYA_CUDA_AMP:-}"
      QLAYA_CPU_AMP: "${QLAYA_CPU_AMP:-}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${QLAYA_GPU_ID:-0}"]
              capabilities: [gpu]
