services:
  qlaya:
    build:
      context: .
      args:
        TORCH_INDEX: "${QLAYA_TORCH_INDEX:-cpu}"
        TORCH_VERSION: "${QLAYA_TORCH_VERSION:-2.14.0}"
    environment:
      QLAYA_DEVICE: "${QLAYA_DEVICE:-cpu}"
      # The autocast dtype the runtime picks when it builds the model on the selected device
      # (`qlaya/agent.py`). An empty value means "use the checkpoint's own `amp_dtype`", which is
      # what these images have always served. README's threshold section measures what fp16 vs
      # bf16 decides differently.
      QLAYA_CUDA_AMP: "${QLAYA_CUDA_AMP:-}"
      QLAYA_CPU_AMP: "${QLAYA_CPU_AMP:-}"
      QLAYA_MODEL: "${QLAYA_MODEL:-auto}"
      QLAYA_MODEL_PATH: "${QLAYA_MODEL_PATH:-}"
      QLAYA_REQUEST_FILE: "${QLAYA_REQUEST_FILE:-/opt/qlaya/examples/request.json}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_TOKEN_FILE: "${HF_TOKEN_FILE:-}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-4}"
    volumes:
      - model-cache:/home/qlaya/.cache/huggingface
    init: true

volumes:
  model-cache:
    name: "${QLAYA_CACHE_VOLUME:-${COMPOSE_PROJECT_NAME}_model-cache}"
