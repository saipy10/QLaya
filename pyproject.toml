[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qlaya"
version = "0.4.0"
description = "QLaya — fast, local, on-device decision engine with calibrated probabilities and user-selectable quantized model variants"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Convai Innovations" }
]
keywords = ["decision-model", "rlcd", "calibration", "system-one", "routing", "guardrails", "moderation", "triage", "quantization", "onnx", "qlaya"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
    "matplotlib>=3.10.9",
]

[tool.setuptools]
# assets/, research/ and notebooks/ sit in the root, so auto-discovery bails out.
packages = ["qlaya", "qlaya.mcp", "qlaya.integrations"]

[project.optional-dependencies]
# `pip install qlaya[serve]` adds the HTTP server (qlaya.serve / the qlaya-serve CLI).
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",  # examples/server.py form uploads
]
# `pip install qlaya[fast]` adds the TileLang GPU fast path (qlaya/fast.py); everything else works without it.
fast = ["tilelang>=0.1.14"]

# `pip install qlaya[mcp]` adds the MCP stdio server (qlaya.mcp / the qlaya-mcp-server CLI).
mcp = ["mcp>=2.2.0"]

# `pip install qlaya[structured]` adds pydantic for the typed-model helpers (qlaya/structured.py).
structured = ["pydantic>=2.0.0"]

# `pip install qlaya[onnx]` adds ONNX Runtime for `qlaya.onnx_agent` and `onnxscript`, which
# `torch.onnx.export` requires (`scripts/export_onnx.py`, `tests/test_onnx.py`).
onnx = ["onnx", "onnxruntime", "onnxscript"]

# `pip install qlaya[langchain]` adds the LangChain / LangGraph integrations (qlaya.integrations).
langchain = [
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
]
langgraph = [
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
]

# `pip install qlaya[llamaindex]` adds the LlamaIndex query router & selector integrations (qlaya.integrations).
llamaindex = [
    "llama-index-core>=0.10.0",
]

# `pip install qlaya[crewai]` adds the CrewAI multi-agent delegation router (qlaya.integrations).
crewai = [
    "crewai>=0.28.0",
]

[project.scripts]
qlaya = "qlaya.cli:main"
qlaya-serve = "qlaya.serve:main"
qlaya-evals = "qlaya.evals_cli:main"
qlaya-mcp-server = "qlaya.mcp.server:main"

[project.urls]
Homepage = "https://github.com/saipy10/QLaya"
Repository = "https://github.com/saipy10/QLaya.git"
Issues = "https://github.com/saipy10/QLaya/issues"
