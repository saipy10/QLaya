name: qlaya
description: >
  QLaya — fast, local, on-device decision engine with calibrated
  probabilities and user-selectable quantized model variants. Dart client for the
  QLaya HTTP server or direct ONNX inference.
version: 0.4.0
repository: https://github.com/saipy10/QLaya
homepage: https://github.com/saipy10/QLaya

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.2.0
  json_annotation: ^4.8.1

dev_dependencies:
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  test: ^1.24.0
  lints: ^3.0.0
